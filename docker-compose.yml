services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не пробрасывается: API подключается к базе по имени сервиса db.
    # Нужен доступ с хоста (psql, DBeaver, Alembic из venv) — раскомментируйте строки ниже.
    # Если на 5432 уже работает локальный PostgreSQL, возьмите другой порт, например "5433:5432".
    # ports:
    #   - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@db:5432/${POSTGRES_DB:-taskflow}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Миграции применяются до старта API; exec передаёт сигналы остановки Uvicorn.
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
