name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style:
    name: Style check (Black)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check app tests scripts alembic

  analysis:
    name: Static analysis (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python code
        run: python -m ruff check app tests scripts alembic

  tests:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://taskflow:taskflow@localhost:5432/taskflow_test
      TASKFLOW_TEST_DATABASE_URL: postgresql+psycopg2://taskflow:taskflow@localhost:5432/taskflow_test
      TASKFLOW_E2E_BASE_URL: http://127.0.0.1:8000
      LOG_LEVEL: WARNING
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
      - name: Start API for end-to-end tests
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/taskflow-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/taskflow-api.pid"
      - name: Wait for API health check
        run: curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health
      - name: Run tests
        run: python -m pytest -q
      - name: Stop API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/taskflow-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/taskflow-api.pid")" 2>/dev/null || true
          fi
